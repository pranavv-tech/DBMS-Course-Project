{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h2>Create Maintenance Request</h2>
</div>

<section class="panel form-panel">
    <form method="post">
        <div class="grid-two">
            <div class="field-group">
                <label>User</label>
                <select name="user_id" required>
                    <option value="">Select user</option>
                    {% for user in users %}
                    <option value="{{ user.user_id }}">{{ user.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field-group">
                <label>Room</label>
                <select name="room_id" required>
                    <option value="">Select room</option>
                    {% for room in rooms %}
                    <option value="{{ room.room_id }}">{{ room.building_name }} - {{ room.room_number }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field-group">
                <label>Category</label>
                <select name="category_id" required>
                    <option value="">Select category</option>
                    {% for category in categories %}
                    <option value="{{ category.category_id }}">{{ category.category_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field-group">
                <label>Priority</label>
                <select name="priority_id" required>
                    <option value="">Select priority</option>
                    {% for priority in priorities %}
                    <option value="{{ priority.priority_id }}">{{ priority.priority_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="field-group">
            <label>Title</label>
            <input type="text" name="title" maxlength="150" required>
        </div>

        <div class="field-group">
            <label>Description</label>
            <textarea name="description" rows="5" required></textarea>
        </div>

        <div class="form-actions">
            <button class="btn" type="submit">Submit Request</button>
            <a class="btn btn-secondary" href="{{ url_for('requests_list') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
