{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h2>Close Request</h2>
</div>

<section class="panel form-panel">
    <p><strong>Request:</strong> {{ request.request_number }} - {{ request.title }}</p>
    <form method="post">
        <div class="field-group">
            <label>Closure Details</label>
            <textarea name="closure_details" rows="4" required></textarea>
        </div>

        <div class="field-group">
            <label>Closed Date</label>
            <input type="date" name="closed_date" required>
        </div>

        <div class="form-actions">
            <button class="btn" type="submit">Close Request</button>
            <a class="btn btn-secondary" href="{{ url_for('request_details', request_id=request.request_id) }}">Back</a>
        </div>
    </form>
</section>
{% endblock %}
